name: "✨ Feature request"
description: Propose a platform or tooling feature for awesome-ai-runbooks.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **awesome-ai-runbooks**! Use this form to
        propose an improvement to the tooling, docs, CI, or governance of the
        repository. To request a *new runbook*, please use the
        **Runbook request** form instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? What is the current pain?
      placeholder: "Contributors have no automated way to check word counts before opening a PR..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see. Be specific.
      placeholder: "Add a `--word-count` flag to the validator that reports per-section counts..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why did you reject them?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this affect?
      options:
        - tooling
        - docs
        - ci
        - governance
        - other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I have read and agree to follow the [Code of Conduct](../blob/main/CODE_OF_CONDUCT.md).
          required: true
        - label: I have searched existing issues and discussions and this is not a duplicate.
          required: true
