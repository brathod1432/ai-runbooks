name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,roadmap,good first issue"
          exempt-pr-labels: "pinned,security,work-in-progress"
          stale-issue-message: >
            This issue has been inactive for 45 days and is now marked stale.
            Comment to keep it open; otherwise it will be closed in 14 days.
          stale-pr-message: >
            This pull request has been inactive for 45 days and is now marked
            stale. Push a commit or comment to keep it open.
          close-issue-message: >
            Closing due to inactivity. Please reopen if this is still relevant.
          close-pr-message: >
            Closing due to inactivity. Please reopen when you are ready to continue.
